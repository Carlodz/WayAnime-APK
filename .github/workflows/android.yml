name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches: [main, master]

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Capacitor add + sync
        run: |
          npm install
          npx cap add android
          npx cap sync android

      - name: Stamp version
        run: |
          set -e
          VER=$(node -p "require('./package.json').version")
          RUN=${{ github.run_number }}
          VCODE=$((40000 + RUN))
          SHA=$(git rev-parse --short HEAD)
          TAG="v${VER}-b${RUN}-${SHA}"
          echo "WA_TAG=${TAG}" >> $GITHUB_ENV
          echo "window.WA_BUILD={v:'${VER}',run:${RUN},code:${VCODE}}" > www/version.js || true
          npx cap sync android
          G=android/app/build.gradle
          sed -i -E "s/versionCode[[:space:]]+[0-9]+/versionCode ${VCODE}/" $G
          sed -i -E "s/versionName[[:space:]]+\"[^\"]*\"/versionName \"${VER}\"/" $G
          if ! grep -q "versionCode ${VCODE}" $G; then
            sed -i "/defaultConfig {/a\        versionCode ${VCODE}\n        versionName \"${VER}\"" $G
          fi
          echo "Building ${TAG}"

      - name: Native plugins + deps
        run: |
          set -e
          JAVA=android/app/src/main/java/com/wayanime/app
          mkdir -p $JAVA
          for f in native/*.java; do [ -f "$f" ] && cp "$f" $JAVA/; done
          ls -la $JAVA/
          mkdir -p android/app/src/main/res/drawable
          if ls native/ic_*.xml 1>/dev/null 2>&1; then cp native/ic_*.xml android/app/src/main/res/drawable/; fi

          G=android/app/build.gradle
          # WorkManager + Jsoup (خاصين لـ EpisodeWorker / NotifyPlugin)
          if [ -f native/EpisodeWorker.java ] || [ -f "$JAVA/EpisodeWorker.java" ]; then
            grep -q 'androidx.work:work-runtime' $G || sed -i '/^dependencies {/a\    implementation "androidx.work:work-runtime:2.9.1"' $G
            grep -q 'org.jsoup:jsoup' $G || sed -i '/^dependencies {/a\    implementation "org.jsoup:jsoup:1.17.2"' $G
            echo "Added WorkManager + Jsoup"
            grep -n 'work-runtime\|jsoup' $G || true
          fi

          M=android/app/src/main/AndroidManifest.xml
          grep -q POST_NOTIFICATIONS $M || sed -i 's#<application#<uses-permission android:name="android.permission.POST_NOTIFICATIONS" />\n    <application#' $M || true
          grep -q usesCleartextTraffic $M || sed -i 's#<application#<application android:usesCleartextTraffic="true"#' $M || true

      - name: App icon
        run: |
          set -e
          sudo apt-get update -qq && sudo apt-get install -y -qq imagemagick
          IM=$(command -v magick || echo convert)
          RES=android/app/src/main/res
          ICON=""
          for c in assets/app-icon.png www/assets/app-icon.png www/assets/icon.png assets/icon.png; do
            [ -f "$c" ] && ICON="$c" && break
          done
          [ -z "$ICON" ] && echo "no icon" && exit 0
          for d in mdpi:48 hdpi:72 xhdpi:96 xxhdpi:144 xxxhdpi:192; do
            IFS=: read n s <<< "$d"
            $IM "$ICON" -resize ${s}x${s} $RES/mipmap-$n/ic_launcher.png
            $IM "$ICON" -resize ${s}x${s} $RES/mipmap-$n/ic_launcher_round.png
            $IM "$ICON" -resize ${s}x${s} $RES/mipmap-$n/ic_launcher_foreground.png 2>/dev/null || true
          done

      - name: Build APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Upload
        run: |
          cp android/app/build/outputs/apk/debug/app-debug.apk "WayAnime-${WA_TAG}.apk"
          ls -lh WayAnime-*.apk

      - uses: actions/upload-artifact@v4
        with:
          name: WayAnime-${{ env.WA_TAG }}
          path: WayAnime-${{ env.WA_TAG }}.apk
          retention-days: 30
