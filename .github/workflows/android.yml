name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches: [main, master]

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Capacitor - add android + sync
        run: |
          npm install
          npx cap add android
          npx cap sync android

      - name: Native plugins
        run: |
          set -e
          JAVA=android/app/src/main/java/com/wayanime/app
          mkdir -p $JAVA
          for f in ImmersivePlugin.java MainActivity.java NotifyPlugin.java EpisodeWorker.java; do
            [ -f native/$f ] && cp native/$f $JAVA/
          done
          ls -la $JAVA/

      - name: Notifications (WorkManager + Jsoup + permission)
        run: |
          set -e
          mkdir -p android/app/src/main/res/drawable
          if ls native/ic_*.xml 1>/dev/null 2>&1; then cp native/ic_*.xml android/app/src/main/res/drawable/; fi
          G=android/app/build.gradle
          grep -q "androidx.work:work-runtime" $G || sed -i '/^dependencies {/a\    implementation "androidx.work:work-runtime:2.9.1"' $G
          grep -q "org.jsoup:jsoup" $G || sed -i '/^dependencies {/a\    implementation "org.jsoup:jsoup:1.17.2"' $G
          M=android/app/src/main/AndroidManifest.xml
          grep -q POST_NOTIFICATIONS $M || sed -i 's#<application#<uses-permission android:name="android.permission.POST_NOTIFICATIONS" />\n    <application#' $M
          grep -q usesCleartextTraffic $M || sed -i 's#<application#<application android:usesCleartextTraffic="true"#' $M || true
          grep -n "work-runtime\|jsoup" $G || true

      - name: Splash image
        run: |
          set -e
          sudo apt-get update -qq && sudo apt-get install -y -qq imagemagick || true
          IM=$(command -v magick || echo convert)
          RES=android/app/src/main/res
          SRC=""
          for c in assets/splash.jpg www/assets/splash.jpg; do [ -f "$c" ] && SRC="$c" && break; done
          [ -z "$SRC" ] && echo "no splash" && exit 0
          for f in $(find $RES -name 'splash.png' 2>/dev/null); do
            case "$f" in
              *land*) $IM "$SRC" -resize 1280x720^ -gravity center -extent 1280x720 "$f" ;;
              *)      $IM "$SRC" -resize 720x1280^ -gravity center -extent 720x1280 "$f" ;;
            esac
          done

      - name: App icon
        run: |
          set -e
          sudo apt-get install -y -qq imagemagick || true
          IM=$(command -v magick || echo convert)
          RES=android/app/src/main/res
          ICON=""
          for c in assets/app-icon.png www/assets/app-icon.png www/assets/icon.png assets/icon.png; do
            [ -f "$c" ] && ICON="$c" && break
          done
          [ -z "$ICON" ] && echo "no icon" && exit 0
          for d in mdpi:48 hdpi:72 xhdpi:96 xxhdpi:144 xxxhdpi:192; do
            IFS=: read n s <<< "$d"
            $IM "$ICON" -resize ${s}x${s} $RES/mipmap-$n/ic_launcher.png
            $IM "$ICON" -resize ${s}x${s} $RES/mipmap-$n/ic_launcher_round.png
            $IM "$ICON" -resize ${s}x${s} $RES/mipmap-$n/ic_launcher_foreground.png 2>/dev/null || true
          done

      - name: Build debug APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - uses: actions/upload-artifact@v4
        with:
          name: WayAnime-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 30
